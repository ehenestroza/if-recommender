#cloud-config
#
# OCI cloud-init for the IFDB recs web app.
#
# Paste into "Show advanced options → Management → Cloud-init script" when
# creating the instance, or pass with:
#     oci compute instance launch --user-data-file deploy/cloud-init.yaml ...
#
# Works on Ubuntu 24.04, x86_64 or Ampere A1 (aarch64). Nothing here depends on
# the distro's Python: uv downloads its own CPython 3.14, so 24.04 shipping 3.12
# is irrelevant and the system interpreter is left alone for system tools.
#
# EDIT THE VALUES UNDER `write_files: /etc/if-recommender.env` BELOW.
#
# See deploy/README.md for the two steps this cannot do for you: opening ports
# 80 and 443 in the OCI security list, and issuing the TLS certificate.

package_update: true
packages:
  - git
  - nginx
  - iptables-persistent

write_files:
  # ---------------------------------------------------------------------------
  # Deployment settings. REPO and DOMAIN are the values you must set.
  # ---------------------------------------------------------------------------
  - path: /etc/if-recommender.env
    permissions: "0644"
    content: |
      # Public HTTPS URL, or git@github.com:owner/repo.git with a deploy key.
      REPO=https://github.com/ehenestroza/if-recommender.git
      BRANCH=main

      # Public hostname. Drives nginx's server_name and is the -d argument to
      # certbot. Leave empty to serve on the bare IP as a catch-all, which is
      # what you want before DNS exists — certbot cannot issue for an IP.
      DOMAIN=ifdb-recs.datalexic.com

  # ---------------------------------------------------------------------------
  # Runtime environment for the service. The thread caps are appended by runcmd
  # from nproc rather than written here: this file is shape-independent, and a
  # hardcoded 2 silently wastes half of a 4-vCPU E5 the way a hardcoded 4
  # oversubscribes a 2-OCPU A1.
  # ---------------------------------------------------------------------------
  - path: /etc/if-recommender-runtime.env
    permissions: "0644"
    content: |
      # Bound to localhost: nginx is the only thing that talks to it, so the app
      # is never on the public interface.
      GRADIO_SERVER_NAME=127.0.0.1
      GRADIO_SERVER_PORT=7860
      # glibc allocates a heap arena per thread and rarely returns memory. The
      # app's growth under load is arena, not live objects, so capping arenas
      # bounds it. macOS has no equivalent, which is why laptop measurements of
      # this app's memory do not transfer.
      MALLOC_ARENA_MAX=2

  # ---------------------------------------------------------------------------
  # systemd service — restarts on failure and comes back after reboot.
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/if-recommender.service
    permissions: "0644"
    content: |
      [Unit]
      Description=IFDB recs web app
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      WorkingDirectory=/opt/if-recommender
      Environment=HOME=/home/ubuntu
      EnvironmentFile=/etc/if-recommender-runtime.env
      ExecStart=/usr/local/bin/uv run --frozen python app.py
      Restart=always
      RestartSec=10
      # Loading the models, FAISS index and ranking tables takes a while on two
      # cores; systemd must not call that a failed start.
      TimeoutStartSec=600
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  # ---------------------------------------------------------------------------
  # nginx reverse proxy. __SERVER_NAME__ is substituted from DOMAIN by runcmd.
  #
  # Only the plain-HTTP vhost is defined here. certbot --nginx rewrites this
  # file in place to add the TLS listener and the 80 → 443 redirect, so writing
  # those by hand would mean maintaining two sources of truth for the same
  # block and would break `certbot renew`'s ability to find what it manages.
  # ---------------------------------------------------------------------------
  - path: /etc/nginx/sites-available/if-recommender
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name __SERVER_NAME__;

          # Model weights and the ranking tables make responses large; results
          # pages are HTML tables of up to 50 rows.
          client_max_body_size 16m;

          location / {
              proxy_pass http://127.0.0.1:7860;
              proxy_http_version 1.1;

              # Gradio's queue runs over websockets and server-sent events. Both
              # need the upgrade headers, and SSE needs buffering off or the
              # progress updates arrive all at once when the response completes.
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_buffering off;
              proxy_cache off;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              # A cold vibe query scores the whole candidate pool with the
              # cross-encoder on two cores. The default 60s can cut that off.
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

runcmd:
  - set -eux

  # OCI's Ubuntu images ship an iptables policy that accepts established traffic
  # and port 22, then rejects the rest — so 80 and 443 are blocked in the OS even
  # once the security list allows them. Insert ahead of that reject and persist.
  # 443 is opened here even though TLS is issued later: certbot's --nginx
  # installer reloads straight into an HTTPS listener, and an unreachable 443 at
  # that moment looks exactly like a broken certificate.
  - iptables -I INPUT 1 -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 443 -m conntrack --ctstate NEW -j ACCEPT
  - netfilter-persistent save

  # One OpenMP/MKL thread per vCPU. Inference is serialised behind Gradio's
  # queue, so intra-op parallelism is where the cores actually get used.
  - printf 'OMP_NUM_THREADS=%s\nMKL_NUM_THREADS=%s\n' "$(nproc)" "$(nproc)" >> /etc/if-recommender-runtime.env

  # uv, installed system-wide rather than under ~ubuntu: the installer's default
  # is $XDG_BIN_HOME then $HOME/.local/bin, so a hardcoded per-user ExecStart path
  # would break silently if either changed. UV_INSTALL_DIR pins it.
  - curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh
  - /usr/local/bin/uv --version

  # Shallow clone: full history carries every superseded copy of the models and
  # ranking tables, which is several times the size of the checkout itself.
  - . /etc/if-recommender.env
  - install -d -o ubuntu -g ubuntu /opt/if-recommender
  - su - ubuntu -c "git clone --depth 1 --branch $BRANCH $REPO /opt/if-recommender"

  # Downloads CPython 3.14 and the exact locked dependency versions. --frozen
  # refuses to re-resolve, so the VM gets what was tested rather than whatever
  # is newest today.
  - su - ubuntu -c 'cd /opt/if-recommender && /usr/local/bin/uv sync --frozen'

  # Falls back to the _ catch-all when DOMAIN is unset, so a DNS-less instance
  # still serves on its bare IP instead of nginx rejecting every request.
  - sed -i "s/__SERVER_NAME__/${DOMAIN:-_}/" /etc/nginx/sites-available/if-recommender

  - ln -sf /etc/nginx/sites-available/if-recommender /etc/nginx/sites-enabled/if-recommender
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl restart nginx
  - systemctl daemon-reload
  - systemctl enable --now if-recommender

  # certbot is installed but not run. Let's Encrypt allows 5 duplicate
  # certificates per week, and this file gets re-run during infrastructure
  # debugging — an automated issuance would burn that quota on instances that
  # were never going to serve traffic. It also cannot succeed until DNS points
  # here and the security list is open, neither of which cloud-init controls.
  - snap install --classic certbot
  - ln -sf /snap/bin/certbot /usr/local/bin/certbot

final_message: |
  IFDB recs deployed after $UPTIME seconds.

  Two manual steps remain — see deploy/README.md:

    1. Open TCP 80 and 443 in the OCI security list for the public subnet.
       cloud-init handles the OS firewall but cannot reach the VCN layer.

    2. Point DOMAIN's A record at this instance, then issue the certificate:

         sudo certbot --nginx -d "$(. /etc/if-recommender.env; echo $DOMAIN)"

       Leave port 80 open afterwards; the HTTP-01 renewal challenge needs it.

  Health checks:

    systemctl status if-recommender
    journalctl -u if-recommender -f
    cd /opt/if-recommender && sudo -u ubuntu /usr/local/bin/uv run scripts/measure_memory.py
