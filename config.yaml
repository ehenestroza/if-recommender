paths:
  data_dir: "data"
  model_dir: "models"
  index_dir: "outputs"

database:
  # Live server, used by: 01_extract.py --source mysql
  host: "localhost"
  port: 3306
  user: "root"
  password: ""          # override with env var IFDB_DB_PASSWORD
  database: "ifarchive"

  # Raw IFDB dump served from a disposable container, used by: 01_extract.py --source dump
  dump:
    path: "dump/ifdb-archive.sql.gz"   # .sql or .sql.gz; not version controlled
    image: "mariadb:10.5.26"           # pinned to the server version in the dump header
    container_name: "ifdb-extract"
    tmpfs_size: "3g"                   # datadir in RAM; set to "" to use container storage
    startup_timeout_s: 180
    import_timeout_s: 3600

model:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  max_seq_length: 256
  # Dynamic int8 for the cross-encoder. "auto" enables it only on backends
  # measured to gain from it (fbgemm/x86: 2.02x); on ARM's qnnpack it measured
  # 4x *slower*, so auto leaves it off there. true forces, false disables.
  # Costs nothing detectable in ranking quality — see NOTES.md.
  quantize_reranker: "auto"

preprocessing:
  bayesian_prior_mean: 3.5    # assumed rating for a game with no reviews
  bayesian_prior_weight: 5    # shrinks toward prior until this many real reviews
  rating_deviation_threshold: 0.25  # positive if rating > bayesian_avg + threshold

training:
  epochs: 3
  batch_size: 64
  temperature: 0.07           # InfoNCE softmax temperature
  min_reviews_per_user: 2     # drop users with fewer interactions
  min_reviews_per_game: 2     # drop games with fewer interactions
  val_frac: 0.1
  test_frac: 0.1
  learning_rate: 2.0e-5
  warmup_ratio: 0.1

reranker_training:
  epochs: 2
  batch_size: 16
  learning_rate: 2.0e-5

retrieval:
  min_retrieval_score: 0.25   # drop candidates with cosine similarity below this
  min_rerank_score: 0.10      # relevance floor; low enough to leave filter headroom, high enough to display
  top_k_retrieve: 50          # raw-retrieval evaluation only; the pipeline reranks the whole pool
  top_k_rerank: 25
  # Max candidates scored live, applied after the tag pre-filter; 0 = no cap.
  # Precomputed modes ignore it. 1000 is a tail control: it leaves the median
  # query untouched and clips the worst case, at zero measured quality cost
  # (ΔNDCG@10 = 0.0000, 0.992 page overlap over 300 users).
  # 500, not the 1,000 the cap experiment settled on: that was chosen against an
  # x86 host where the tail cost 11.7s, and an A1 core scores 19 pairs/s where
  # the old box managed 91.5. The tag policy above already handles queries
  # offering three or more tags, so what remains under this cap is the one- and
  # two-tag queries it cannot reach — which is where the 0.854 overlap@25 that
  # 500 costs is now actually spent, rather than across every query.
  rerank_pool_cap: 500
  prefilter_by_tag: true      # drop candidates sharing no tag with the query (measured free)
  # Ask for two shared tags once the query offers three or more. Measured over
  # 300 held-out users: 72% fewer pairs scored at 0.86 overlap@25 with the
  # unfiltered page, and NDCG@10 unmoved — a better trade than any cap, because
  # it prunes on the tags the query is made of rather than on cosine rank.
  # Live paths only; precompute has no latency budget to protect.
  prefilter_tag_matches: 2
  prefilter_tag_matches_from: 3
  index_type: "flat"          # "hnsw" for faster approximate search at scale
  hnsw_m: 32
  use_rating_reranking: true  # blend normalised bayesian_avg into rerank score
  rating_weight: 0.5          # weight on bayesian_avg/5; 0.3-0.5 measure the same, above 0.5 hurts
  use_diversity: true         # post-rerank step to cover all target genres/systems
