paths:
  data_dir: "data"
  model_dir: "models"
  index_dir: "outputs"

database:
  # Live server, used by: 01_extract.py --source mysql
  host: "localhost"
  port: 3306
  user: "root"
  password: ""          # override with env var IFDB_DB_PASSWORD
  database: "ifarchive"

  # Raw IFDB dump served from a disposable container, used by: 01_extract.py --source dump
  dump:
    path: "dump/ifdb-archive.sql.gz"   # .sql or .sql.gz; not version controlled
    image: "mariadb:10.5.26"           # pinned to the server version in the dump header
    container_name: "ifdb-extract"
    tmpfs_size: "3g"                   # datadir in RAM; set to "" to use container storage
    startup_timeout_s: 180
    import_timeout_s: 3600

model:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  max_seq_length: 256

preprocessing:
  bayesian_prior_mean: 3.5    # assumed rating for a game with no reviews
  bayesian_prior_weight: 5    # shrinks toward prior until this many real reviews
  rating_deviation_threshold: 0.25  # positive if rating > bayesian_avg + threshold

training:
  epochs: 3
  batch_size: 64
  temperature: 0.07           # InfoNCE softmax temperature
  min_reviews_per_user: 2     # drop users with fewer interactions
  min_reviews_per_game: 2     # drop games with fewer interactions
  val_frac: 0.1
  test_frac: 0.1
  learning_rate: 2.0e-5
  warmup_ratio: 0.1

reranker_training:
  epochs: 2
  batch_size: 16
  learning_rate: 2.0e-5

retrieval:
  min_retrieval_score: 0.25   # drop candidates with cosine similarity below this
  min_rerank_score: 0.10      # relevance floor; low enough to leave filter headroom, high enough to display
  top_k_retrieve: 50          # raw-retrieval evaluation only; the pipeline reranks the whole pool
  top_k_rerank: 25
  rerank_pool_cap: 0          # max candidates scored live; 0 = no cap. Precomputed modes ignore it
  prefilter_by_tag: true      # drop candidates sharing no tag with the query (measured free)
  index_type: "flat"          # "hnsw" for faster approximate search at scale
  hnsw_m: 32
  use_rating_reranking: true  # blend normalised bayesian_avg into rerank score
  rating_weight: 0.5          # weight on bayesian_avg/5; 0.3-0.5 measure the same, above 0.5 hurts
  use_diversity: true         # post-rerank step to cover all target genres/systems
