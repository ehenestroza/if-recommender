paths:
  data_dir: "data"
  model_dir: "models"
  index_dir: "outputs"

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: ""          # override with env var IFDB_DB_PASSWORD
  database: "ifarchive"

model:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_seq_length: 256

preprocessing:
  bayesian_prior_mean: 3.5    # assumed rating for a game with no reviews
  bayesian_prior_weight: 5   # shrinks toward prior until this many real reviews

training:
  epochs: 3
  batch_size: 64
  min_rating_positive: 4      # reviews >= 4 stars are positive
  max_rating_negative: 3      # reviews <= 3 stars are negative
  min_reviews_per_user: 2     # drop users with fewer interactions
  min_reviews_per_game: 2     # drop games with fewer interactions
  val_frac: 0.1
  test_frac: 0.1
  learning_rate: 2.0e-5
  warmup_ratio: 0.1

retrieval:
  top_k_retrieve: 100
  top_k_rerank: 10
  index_type: "flat"          # "hnsw" for faster approximate search at scale
  hnsw_m: 32
